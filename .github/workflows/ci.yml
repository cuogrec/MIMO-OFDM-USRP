name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded .deb packages (the Azure mirror can take 30 min for GNU Radio)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-gnuradio-v1

      - name: Install GNU Radio, numpy, FFmpeg (apt; no USRP needed)
        timeout-minutes: 45
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends \
            gnuradio python3-numpy python3-matplotlib python3-pip python3-setuptools ffmpeg
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
          /usr/bin/python3 -c "import gnuradio.gr as g, numpy; print('GNU Radio', g.version(), 'numpy', numpy.__version__)"

      - name: Install the shared ofdm321 package (editable)
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages --no-build-isolation -e .
          /usr/bin/python3 -c "import ofdm321; print('ofdm321', ofdm321.__version__)"

      - name: Unit tests (tests/test_modem.py)
        run: /usr/bin/python3 tests/test_modem.py

      - name: Two-process simulation, 10 s video at 400 kS/s (must be SIM_RX_VERIFIED)
        run: bash tools/ci_sim.sh 10 --rate 400e3

      - name: Same with the LDPC inner code (--fec ldpc, must be SIM_RX_VERIFIED)
        run: bash tools/ci_sim.sh 10 --rate 400e3 --fec ldpc

      - name: Keep the simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: |
            OFDM_N321_RX/runs/*_ci/report.json
            OFDM_N321_TX/runs/*_ci/report.json
          if-no-files-found: ignore
